<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animathèque</title>
<meta name="description" content="Ma liste d'animes : ce que je regarde, ce que j'ai fini, mes notes.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#141130">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Animathèque">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://graphql.anilist.co">
<link rel="preconnect" href="https://s4.anilist.co">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1:wght@400;500;700;800&display=swap">
<style>
/*
  Animathèque — design tokens
  Layout: indigo night chrome that stays quiet; the posters carry the colour.
  Bold move: each anime's own key colour (AniList coverImage.color) tints the hero and its fiche.
*/
:root {
  --night: #141130;
  --night-2: #1B1740;
  --night-3: #241F50;
  --mist: #352E6B;
  --line: rgba(201, 197, 240, .13);
  --paper: #F4F2FF;
  --haze: #ABA6D4;
  --dim: #807BAA;
  --sakura: #FF8FB8;
  --sakura-ink: #2A0718;
  --tint: #8B7BFF;
  --tint-hi: #A99EFF;
  --tint-ink: #141130;
  --s-watching: #5BE3A6;
  --s-completed: #8FB0FF;
  --s-plan: #C9C5E8;
  --s-paused: #FFD06B;
  --s-dropped: #FF7E8A;
  --display: "Dela Gothic One", "Arial Black", "Helvetica Neue", sans-serif;
  --body: "M PLUS 1", "Segoe UI", system-ui, -apple-system, sans-serif;
  --gutter: max(20px, env(safe-area-inset-left, 0px));
  --gutter-r: max(20px, env(safe-area-inset-right, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--night); }
body { margin: 0; background: var(--night); color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }
img { max-width: 100%; display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--sakura); outline-offset: 3px; border-radius: 6px; }
.wrap { width: 100%; max-width: 1280px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter-r); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 30; padding-top: env(safe-area-inset-top, 0px); background: rgba(20, 17, 48, .86); backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 12px 28px; padding-block: 12px; flex-wrap: wrap; }
.brand { font-family: var(--display); font-size: 23px; line-height: 1; color: var(--paper); text-decoration: none; letter-spacing: -.01em; display: inline-flex; align-items: center; gap: 10px; }
.brand i { width: 12px; height: 12px; border-radius: 3px; background: var(--sakura); transform: rotate(45deg); flex: none; }
.tabs { display: flex; gap: 2px; }
.tabs a { color: var(--haze); text-decoration: none; font-weight: 700; padding: 8px 14px; border-radius: 10px; display: inline-flex; align-items: baseline; gap: 6px; }
.tabs a:hover { color: var(--paper); background: var(--night-3); }
.tabs a[aria-current="page"] { color: var(--paper); background: var(--night-3); box-shadow: inset 0 -2px 0 var(--sakura); }
.tabs .count { font-size: 12px; color: var(--dim); font-weight: 500; }
.search { position: relative; flex: 1 1 300px; max-width: 520px; margin-left: auto; }
.search input { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--night-2); padding: 0 16px 0 44px; font-size: 15px; color: var(--paper); }
.search input::placeholder { color: var(--dim); }
.search input:focus { outline: none; border-color: var(--sakura); background: var(--night-3); }
.search svg { position: absolute; left: 15px; top: 14px; width: 16px; height: 16px; color: var(--dim); pointer-events: none; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 8px); margin: 0; padding: 6px; list-style: none; background: var(--night-2); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.7); max-height: min(72vh, 620px); overflow: auto; }
.res { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 8px; border-radius: 12px; cursor: pointer; }
.res:hover, .res[aria-selected="true"] { background: var(--night-3); }
.res img, .res .ph { width: 46px; height: 66px; border-radius: 7px; object-fit: cover; background: var(--mist); }
.res-t { font-weight: 700; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-s { font-size: 13px; color: var(--haze); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.res-msg { padding: 14px 12px; color: var(--haze); font-size: 14px; }
.res-err { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.feed-head { display: flex; align-items: center; gap: 12px; }
.feed-head h2 { flex: 1; }
.feed-head .icon-btn svg { width: 18px; height: 18px; }
.icon-btn.spin svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- buttons, chips ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; border: 1px solid var(--line); background: var(--night-3); color: var(--paper); font-weight: 700; padding: 10px 18px; font-size: 14px; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--haze); }
.btn-main { background: var(--sakura); color: var(--sakura-ink); border-color: var(--sakura); }
.btn-main:hover { border-color: var(--paper); }
.btn-ghost { background: transparent; }
.btn-sm { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.btn:disabled { opacity: .55; cursor: progress; }
.st-chip { --sc: var(--s-plan); display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--night); background: var(--sc); white-space: nowrap; line-height: 1.5; }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; isolation: isolate; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--tint) 30%, var(--night)); }
.hero-art { position: absolute; inset: 0; z-index: -2; }
.hero-art img { width: 100%; height: 100%; object-fit: cover; object-position: 60% 30%; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--tint) 34%, var(--night)) 0%, color-mix(in srgb, var(--tint) 24%, var(--night)) 34%, color-mix(in srgb, var(--night) 40%, transparent) 72%, transparent 100%),
    linear-gradient(0deg, var(--night) 0%, transparent 46%); }
.hero-in { display: grid; grid-template-columns: minmax(0, 620px) 1fr; gap: 32px; align-items: end; padding-block: 72px 36px; min-height: 480px; }
.hero-text { display: grid; gap: 14px; align-content: end; }
.hero-kicker { margin: 0; justify-self: start; font-weight: 700; color: var(--tint-hi); font-size: 13px; padding: 4px 11px; border-radius: 999px; background: rgba(20, 17, 48, .62); border: 1px solid color-mix(in srgb, var(--tint-hi) 30%, transparent); }
.hero h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(32px, 5.2vw, 60px); line-height: 1.04; letter-spacing: -.015em; text-wrap: balance; text-shadow: 0 2px 30px rgba(0,0,0,.35); overflow-wrap: anywhere; }
.hero-alt { margin: -4px 0 0; color: var(--haze); font-size: 15px; }
.hero-facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 0; padding: 0; list-style: none; }
.hero-facts li { font-size: 13px; font-weight: 500; padding: 3px 11px; border-radius: 999px; background: rgba(20, 17, 48, .55); border: 1px solid var(--line); }
.hero-syn { margin: 0; max-width: 58ch; color: #DDD9F5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.hero-pick { display: flex; gap: 10px; justify-content: flex-end; align-self: end; }
.hero-pick button { width: 64px; padding: 0; border: 2px solid transparent; border-radius: 9px; overflow: hidden; background: var(--mist); opacity: .62; transition: opacity .2s, border-color .2s; }
.hero-pick button img { aspect-ratio: 2 / 3; object-fit: cover; width: 100%; }
.hero-pick button:hover { opacity: 1; }
.hero-pick button[aria-current="true"] { opacity: 1; border-color: var(--paper); }
.hero-skel { min-height: 480px; background: linear-gradient(100deg, var(--night-2) 30%, var(--night-3) 50%, var(--night-2) 70%); background-size: 300% 100%; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { to { background-position: -150% 0; } }

/* ---------- rows ---------- */
main { flex: 1; }
.page { display: grid; grid-template-columns: minmax(0, 1fr); gap: 52px; padding-block: 40px 64px; }
.row-head { display: flex; align-items: end; justify-content: space-between; gap: 12px 20px; margin-bottom: 18px; flex-wrap: wrap; }
.row-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3vw, 30px); line-height: 1.15; letter-spacing: -.01em; }
.row-head p { margin: 4px 0 0; color: var(--haze); font-size: 14px; }
.row-nav { display: flex; gap: 6px; }
.row-nav button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--night-2); display: grid; place-items: center; }
.row-nav button:hover { border-color: var(--haze); }
.row-nav svg { width: 16px; height: 16px; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 168px; gap: 18px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding-left: 0; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: var(--mist) transparent; }
.strip > * { scroll-snap-align: start; }
.strip.ranked { grid-auto-columns: 214px; gap: 10px; }

/* ---------- poster card ---------- */
.pc { --tint: var(--mist); position: relative; min-width: 0; }
.pc-hit { display: grid; gap: 10px; width: 100%; padding: 0; border: 0; background: none; text-align: left; color: inherit; }
.pc-img { position: relative; display: block; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: color-mix(in srgb, var(--tint) 55%, var(--night-2)); box-shadow: 0 0 0 1px var(--line); transition: box-shadow .18s; }
.pc-img img { width: 100%; height: 100%; object-fit: cover; transition: transform .45s cubic-bezier(.2, .8, .2, 1); }
.pc-hit:hover .pc-img img { transform: scale(1.045); }
.pc-hit:hover .pc-img, .pc-hit:focus-visible .pc-img { box-shadow: 0 0 0 2px var(--tint-hi, var(--haze)), 0 18px 40px -18px color-mix(in srgb, var(--tint) 80%, transparent); }
.pc-hit:focus-visible { outline: none; }
.pc-t { font-weight: 700; font-size: 14.5px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.pc-s { font-size: 13px; color: var(--haze); margin-top: -6px; }
.pc-over { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 2 / 3; pointer-events: none; }
.pc-over > * { pointer-events: auto; }
.pc-tag { position: absolute; left: 8px; top: 8px; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: rgba(20, 17, 48, .82); color: var(--paper); backdrop-filter: blur(6px); }
.pc-state { position: absolute; left: 8px; bottom: 8px; }
.pc-add { position: absolute; right: 8px; bottom: 8px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--paper); color: var(--night); font-size: 22px; line-height: 1; display: grid; place-items: center; box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); font-weight: 700; }
.pc-add:hover { background: var(--sakura); }
.pc-add:disabled { opacity: .7; cursor: progress; }
.pc-add.busy { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.ranked .pc { padding-left: 54px; }
.rank { position: absolute; left: 0; bottom: 52px; font-family: var(--display); font-size: 104px; line-height: .8; color: var(--night); -webkit-text-stroke: 2px var(--dim); pointer-events: none; z-index: 0; letter-spacing: -.06em; }
.ranked .pc-hit, .ranked .pc-over { position: relative; z-index: 1; }
.ranked .pc-over { position: absolute; left: 54px; width: calc(100% - 54px); }

/* list card extras */
.lc-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(20, 17, 48, .7); }
.lc-bar i { display: block; height: 100%; background: var(--sc, var(--s-plan)); }
.lc-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--haze); margin-top: -4px; }
.lc-score { font-weight: 800; color: var(--paper); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lc-score small { color: var(--dim); font-weight: 500; }
.lc-inc { position: absolute; right: 8px; bottom: 14px; border: 0; border-radius: 10px; background: var(--s-watching); color: var(--night); font-weight: 800; font-size: 13px; padding: 4px 10px; box-shadow: 0 6px 18px -6px rgba(0,0,0,.6); }
.lc-new { position: absolute; left: 8px; top: 8px; font-size: 11.5px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: var(--sakura); color: var(--sakura-ink); }

/* ---------- grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 30px 18px; }

/* ---------- list page ---------- */
.lh { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; padding-block: 40px 0; }
.lh h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 5vw, 54px); line-height: 1; letter-spacing: -.015em; }
.lh-sum { margin: 0; font-size: clamp(16px, 2vw, 19px); color: var(--haze); max-width: 62ch; line-height: 1.55; }
.lh-sum b { color: var(--paper); font-weight: 800; font-variant-numeric: tabular-nums; }
.dist { display: flex; height: 12px; border-radius: 999px; overflow: hidden; gap: 3px; max-width: 760px; }
.dist i { display: block; min-width: 8px; }
.bar-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px 20px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filter { --sc: var(--haze); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--night-2); border-radius: 999px; padding: 6px 14px 6px 12px; font-weight: 700; font-size: 14px; }
.filter .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--sc); }
.filter .n { color: var(--dim); font-weight: 500; font-variant-numeric: tabular-nums; }
.filter[aria-pressed="true"] { background: var(--paper); color: var(--night); border-color: var(--paper); }
.filter[aria-pressed="true"] .n { color: var(--night-3); }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.tools label { display: inline-flex; align-items: center; gap: 8px; color: var(--haze); font-size: 14px; }
.tools select { background: var(--night-2); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; color: var(--paper); }
.group { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.group h2 { margin: 0; display: flex; align-items: center; gap: 12px; font-family: var(--display); font-weight: 400; font-size: 24px; }
.group h2 .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--sc); }
.group h2 .n { font-family: var(--body); font-size: 15px; color: var(--dim); font-weight: 500; }
.empty { display: grid; gap: 18px; justify-items: start; padding: 48px 0 8px; max-width: 640px; }
.empty h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.15; }
.empty p { margin: 0; color: var(--haze); font-size: 16px; }
.notice { border: 1px solid var(--line); background: var(--night-2); border-radius: 14px; padding: 16px 18px; color: var(--haze); display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }

/* ---------- drawer (fiche) ---------- */
.dw { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: flex-end; }
.dw-scrim { position: absolute; inset: 0; background: rgba(8, 6, 24, .62); backdrop-filter: blur(3px); }
.drawer { position: relative; width: min(700px, 100%); height: 100%; overflow-y: auto; overscroll-behavior: contain;
  background: linear-gradient(180deg, color-mix(in srgb, var(--tint) 30%, var(--night-2)) 0, var(--night-2) 460px); box-shadow: -30px 0 80px -30px rgba(0,0,0,.8);
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: slidein .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes slidein { from { transform: translateX(40px); opacity: 0; } }
.dw-close { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); z-index: 3; width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(20, 17, 48, .7); backdrop-filter: blur(6px); color: var(--paper); display: grid; place-items: center; }
.dw-close svg { width: 16px; height: 16px; }
.dw-banner { height: 210px; position: relative; overflow: hidden; background: color-mix(in srgb, var(--tint) 45%, var(--night)); }
.dw-banner img { width: 100%; height: 100%; object-fit: cover; }
.dw-banner img.blur { filter: blur(26px) saturate(130%); transform: scale(1.3); opacity: .7; }
.dw-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, color-mix(in srgb, var(--tint) 30%, var(--night-2)) 0%, transparent 70%); }
.dw-head { display: grid; grid-template-columns: 148px minmax(0, 1fr); gap: 22px; align-items: end; padding: 0 28px; margin-top: -96px; position: relative; z-index: 1; }
.dw-cover { width: 148px; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 12px; box-shadow: 0 20px 50px -18px rgba(0,0,0,.85), 0 0 0 1px var(--line); background: var(--mist); }
.dw-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 3.4vw, 34px); line-height: 1.1; text-wrap: balance; overflow-wrap: anywhere; letter-spacing: -.01em; }
.dw-alt { margin: 6px 0 0; color: var(--haze); font-size: 14px; }
.dw-body { display: grid; grid-template-columns: minmax(0, 1fr); gap: 30px; padding: 26px 28px 40px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.facts li { font-size: 13px; padding: 4px 11px; border-radius: 999px; background: rgba(20, 17, 48, .45); border: 1px solid var(--line); }
.airing { margin: -14px 0 0; font-size: 14px; color: var(--tint-hi); font-weight: 700; }
.panel { background: rgba(20, 17, 48, .55); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: grid; gap: 20px; }
.field { display: grid; gap: 10px; }
.field-l { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-weight: 700; font-size: 14px; }
.field-l span { color: var(--haze); font-weight: 500; }
.sts { display: flex; flex-wrap: wrap; gap: 8px; }
.st { --sc: var(--s-plan); display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--night-3); border-radius: 12px; padding: 9px 14px; font-weight: 700; font-size: 14px; }
.st::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--sc); }
.st:hover { border-color: var(--sc); }
.st[aria-pressed="true"] { background: var(--sc); border-color: var(--sc); color: var(--night); }
.st[aria-pressed="true"]::before { background: var(--night); }
.scores { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.scores button { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--night-3); font-weight: 800; font-variant-numeric: tabular-nums; padding: 0; }
.scores button:hover { border-color: var(--tint-hi); }
.scores button.on { background: color-mix(in srgb, var(--tint-hi) 26%, var(--night-3)); border-color: color-mix(in srgb, var(--tint-hi) 50%, transparent); }
.scores button[aria-pressed="true"] { background: var(--tint-hi); border-color: var(--tint-hi); color: var(--tint-ink); }
.prog { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.prog label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--haze); }
.prog select, .prog input { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--night); color: var(--paper); padding: 0 10px; font-variant-numeric: tabular-nums; }
.prog input { width: 76px; text-align: center; }
.prog .of { color: var(--haze); font-size: 14px; }
.step { display: inline-flex; gap: 6px; margin-left: auto; }
.step button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--night-3); font-size: 20px; line-height: 1; font-weight: 700; }
.step button:hover { border-color: var(--haze); }
.progbar { height: 6px; border-radius: 999px; background: var(--night); overflow: hidden; }
.progbar i { display: block; height: 100%; background: var(--sc, var(--s-plan)); border-radius: inherit; }
textarea { width: 100%; min-height: 90px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: var(--night); color: var(--paper); padding: 12px 14px; font-size: 14.5px; line-height: 1.55; }
textarea:focus, .prog select:focus, .prog input:focus { outline: none; border-color: var(--tint-hi); }
.dw-sec h3 { margin: 0 0 12px; font-family: var(--display); font-weight: 400; font-size: 19px; }
.syn { margin: 0; color: #DCD8F3; white-space: pre-line; max-width: 64ch; }
.syn.clamp { display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow: hidden; }
.linkish { background: none; border: 0; padding: 0; color: var(--tint-hi); font-weight: 700; margin-top: 8px; }
.genres { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.genres span { font-size: 12.5px; color: var(--haze); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.parts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.part { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 8px 12px 8px 8px; border-radius: 12px; border: 1px solid var(--line); background: rgba(20, 17, 48, .4); }
.part.cur { border-color: color-mix(in srgb, var(--s-watching) 60%, transparent); }
.part.off { opacity: .5; }
.part img { width: 42px; height: 60px; object-fit: cover; border-radius: 6px; background: var(--mist); }
.part-t { font-weight: 700; line-height: 1.3; }
.part-s { font-size: 13px; color: var(--haze); }
.part label { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--haze); }
.part input { width: 18px; height: 18px; accent-color: var(--s-watching); }
.films { display: grid; grid-auto-flow: column; grid-auto-columns: 120px; gap: 14px; overflow-x: auto; padding-bottom: 6px; }
.films .pc-t { font-size: 13px; }
.dw-links { display: flex; flex-wrap: wrap; gap: 10px; }
.dw-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 18px; }
.danger { background: none; border: 1px solid var(--line); color: var(--s-dropped); border-radius: 10px; padding: 8px 14px; font-weight: 700; font-size: 13px; }
.danger.armed { background: var(--s-dropped); border-color: var(--s-dropped); color: var(--night); }
.dw-loading { padding: 8px 28px 40px; color: var(--haze); display: grid; gap: 12px; }
.skel { height: 14px; border-radius: 8px; background: linear-gradient(100deg, var(--night-3) 30%, var(--mist) 50%, var(--night-3) 70%); background-size: 300% 100%; animation: shimmer 1.6s linear infinite; }

/* ---------- account & friends ---------- */
.acct { position: relative; display: flex; align-items: center; }
.avatar { display: block; width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: var(--mist); flex: none; }
.acct-btn { display: inline-flex; align-items: center; gap: 9px; padding: 3px 12px 3px 3px; border-radius: 999px; border: 1px solid var(--line); background: var(--night-2); font-weight: 700; font-size: 14px; max-width: 220px; }
.acct-btn:hover { border-color: var(--haze); }
.acct-btn .avatar { width: 32px; height: 32px; }
.acct-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 220px; background: var(--night-2); border: 1px solid var(--line); border-radius: 14px; padding: 6px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.7); display: grid; z-index: 40; }
.acct-menu a, .acct-menu button { display: block; width: 100%; text-align: left; padding: 9px 12px; border-radius: 10px; color: var(--paper); text-decoration: none; background: none; border: 0; font-size: 14px; font-weight: 500; }
.acct-menu a:hover, .acct-menu button:hover { background: var(--night-3); }
.btn-al { background: #3DB4F2; color: #0B1622; border-color: #3DB4F2; }
.btn-al:hover { border-color: var(--paper); }
.muted { color: var(--haze); margin: 0; }
.small { font-size: 13px; }
.notice-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.fsearch { display: grid; gap: 10px; max-width: 620px; margin-top: 4px; }
.fsearch input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--night-2); padding: 0 16px; font-size: 15px; color: var(--paper); }
.fsearch input:focus { outline: none; border-color: var(--sakura); background: var(--night-3); }
.users { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.user-row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--night-2); }
.user-row .avatar { width: 44px; height: 44px; }
.user-name { color: var(--paper); font-weight: 800; text-decoration: none; overflow-wrap: anywhere; }
.user-name:hover { text-decoration: underline; }
.friends { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
.friend { display: grid; justify-items: center; align-content: start; gap: 8px; padding: 20px 12px 18px; border: 1px solid var(--line); border-radius: 18px; background: var(--night-2); text-decoration: none; color: var(--paper); text-align: center; }
.friend:hover { border-color: var(--haze); }
.friend .avatar { width: 76px; height: 76px; margin-bottom: 4px; }
.friend-name { font-weight: 800; overflow-wrap: anywhere; }
.friend-sub { font-size: 12.5px; color: var(--haze); }
.prof { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; }
.prof .avatar { width: 88px; height: 88px; box-shadow: 0 0 0 3px var(--night), 0 0 0 4px var(--line); }
.prof-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.mine { font-size: 12.5px; color: var(--sakura); font-weight: 700; margin-top: -6px; }
.fr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.fr-item { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.fr-item a { color: var(--paper); font-weight: 700; text-decoration: none; overflow-wrap: anywhere; }
.fr-item a:hover { text-decoration: underline; }
.fr-st { display: inline-flex; align-items: center; gap: 10px; }

/* ---------- this week ---------- */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 13px; background: var(--night-2); border: 1px solid var(--line); justify-self: start; }
.seg button { border: 0; background: none; color: var(--haze); font-weight: 700; padding: 8px 14px; border-radius: 9px; font-size: 14px; }
.seg button:hover { color: var(--paper); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--night); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; align-items: start; }
.day { background: var(--night-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px 12px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.day.today { border-color: color-mix(in srgb, var(--sakura) 70%, transparent); box-shadow: inset 0 3px 0 var(--sakura); }
.day h3 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 15px; font-weight: 800; }
.slots { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.slot { display: grid; gap: 6px; min-width: 0; }
.slot-time { font-size: 12.5px; font-weight: 800; color: var(--tint-hi); font-variant-numeric: tabular-nums; }
.slot-hit { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; padding: 0; border: 0; background: none; color: var(--paper); text-align: left; }
.slot-hit img, .slot-hit .ph { width: 42px; height: 60px; object-fit: cover; border-radius: 6px; background: var(--mist); }
.slot-hit:hover .slot-t { text-decoration: underline; }
.slot-txt { display: grid; gap: 2px; min-width: 0; }
.slot-t { font-weight: 700; font-size: 13.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.slot-s { font-size: 12px; color: var(--haze); }
.slot.past { opacity: .5; }
.mine-toggle { display: flex; justify-content: flex-end; margin-bottom: -30px; font-size: 14px; color: var(--haze); }
.mine-toggle label { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
.mine-toggle input { width: 16px; height: 16px; accent-color: var(--sakura); }
#recoSlot { display: grid; grid-template-columns: minmax(0, 1fr); gap: 52px; }
#recoSlot:empty { display: none; }

/* ---------- activity feed ---------- */
.page.amis-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 48px; align-items: start; }
.side { gap: 22px; }
.feed { list-style: none; margin: 0; padding: 0; display: grid; }
.act { display: grid; grid-template-columns: 40px minmax(0, 1fr) 44px; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.act:last-child { border-bottom: 0; }
.act .avatar { width: 40px; height: 40px; }
.act-txt { display: grid; gap: 2px; min-width: 0; }
.act-txt p { margin: 0; line-height: 1.45; overflow-wrap: anywhere; }
.act .u { color: var(--paper); font-weight: 800; text-decoration: none; }
.act .u:hover { text-decoration: underline; }
.act .m { display: inline; background: none; border: 0; padding: 0; color: var(--paper); font-weight: 700; text-align: left; text-decoration: underline; text-decoration-color: var(--mist); text-underline-offset: 3px; }
.act .m:hover { text-decoration-color: var(--paper); }
.act time { font-size: 12.5px; color: var(--dim); }
.act-cover { width: 44px; height: 62px; padding: 0; border: 0; border-radius: 7px; overflow: hidden; background: var(--mist); }
.act-cover img { width: 100%; height: 100%; object-fit: cover; }
.tabs .sm { display: none; }
.install button { margin-right: 4px; }

/* ---------- toast & footer ---------- */
.toast { position: fixed; z-index: 70; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); display: flex; align-items: center; gap: 16px; background: var(--paper); color: var(--night); border-radius: 14px; padding: 12px 12px 12px 18px; font-weight: 500; font-size: 14px; box-shadow: 0 20px 50px -18px rgba(0,0,0,.8); max-width: calc(100% - 32px); }
.toast button { border: 0; background: var(--night); color: var(--paper); border-radius: 10px; padding: 6px 12px; font-weight: 700; font-size: 13px; white-space: nowrap; }
footer { border-top: 1px solid var(--line); color: var(--dim); font-size: 13px; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px; padding-block: 22px calc(26px + env(safe-area-inset-bottom, 0px)); }
footer a { color: var(--haze); }
.pref { display: inline-flex; gap: 4px; align-items: center; }
.pref button { background: none; border: 1px solid transparent; color: var(--haze); border-radius: 8px; padding: 2px 8px; font-size: 13px; }
.pref button[aria-pressed="true"] { border-color: var(--line); color: var(--paper); background: var(--night-2); }

@media (max-width: 760px) {
  .acct-name { display: none; }
  .acct-btn { padding: 3px; }
  .prof-acts { margin-left: 0; }
  .hero-in { grid-template-columns: 1fr; min-height: 0; padding-block: 120px 28px; }
  .hero::before { background: linear-gradient(0deg, var(--night) 0%, color-mix(in srgb, var(--tint) 22%, var(--night)) 58%, color-mix(in srgb, var(--night) 30%, transparent) 82%, transparent 100%); }
  .hero-pick { justify-content: flex-start; }
  .hero-pick button { width: 48px; }
  .strip { grid-auto-columns: 138px; gap: 14px; }
  .strip.ranked { grid-auto-columns: 172px; }
  .ranked .pc { padding-left: 40px; }
  .ranked .pc-over { left: 40px; width: calc(100% - 40px); }
  .rank { font-size: 78px; bottom: 50px; }
  .row-nav { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 24px 14px; }
  .drawer { width: 100%; }
  .dw-banner { height: 170px; }
  .dw-head { grid-template-columns: 104px minmax(0, 1fr); gap: 16px; padding: 0 var(--gutter-r) 0 var(--gutter); margin-top: -64px; }
  .dw-cover { width: 104px; }
  .dw-body { padding: 22px var(--gutter-r) 36px var(--gutter); }
  .panel { padding: 16px; }
  .scores button { height: 36px; font-size: 14px; }
  .step { margin-left: 0; }
}
/* ---------- app shell: header actions, bottom bar on phones, search overlay ---------- */
.top-acts { display: flex; align-items: center; gap: 8px; flex: none; }
.icon-btn { position: relative; width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--night-2); color: var(--paper); display: grid; place-items: center; padding: 0; flex: none; }
.icon-btn:hover { border-color: var(--haze); }
.icon-btn svg { width: 20px; height: 20px; }
.icon-btn[aria-expanded="true"] { background: var(--night-3); border-color: var(--haze); }
.search-open, .search-cancel { display: none; }
.tabs .ico, .tabs .count { display: none; }
.badge { position: absolute; top: -7px; right: -7px; min-width: 21px; height: 21px; padding: 0 6px; border-radius: 999px; background: var(--sakura); color: var(--sakura-ink); font-size: 11.5px; font-weight: 800; line-height: 21px; text-align: center; font-variant-numeric: tabular-nums; box-shadow: 0 0 0 3px var(--night); pointer-events: none; }
.badge.pop { animation: pop .55s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.3); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* ---------- notifications ---------- */
.bell { position: relative; }
.notif-panel { position: absolute; right: -6px; top: calc(100% + 10px); width: min(420px, calc(100vw - 32px)); max-height: min(72vh, 660px); overflow-y: auto; overscroll-behavior: contain; background: var(--night-2); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 30px 80px -24px rgba(0,0,0,.85); z-index: 46; animation: dropin .18s ease-out; }
.notif-panel:focus { outline: none; }
@keyframes dropin { from { opacity: 0; transform: translateY(-6px); } }
.np-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px 12px; background: var(--night-2); border-bottom: 1px solid var(--line); }
.np-head h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 20px; }
.np-close { display: none; }
.np-list { list-style: none; margin: 0; padding: 6px; }
.ni { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 10px 10px 12px; border-radius: 14px; }
.ni + .ni { margin-top: 2px; }
.ni.fresh { background: color-mix(in srgb, var(--sakura) 10%, transparent); }
.ni.fresh::before { content: ""; position: absolute; left: 3px; top: 50%; width: 6px; height: 6px; margin-top: -3px; border-radius: 50%; background: var(--sakura); }
.ni .avatar { width: 44px; height: 44px; }
.ni-cover { display: block; width: 44px; height: 62px; padding: 0; border: 0; border-radius: 8px; overflow: hidden; background: color-mix(in srgb, var(--tint, var(--mist)) 50%, var(--night-3)); }
.ni-cover img { width: 100%; height: 100%; object-fit: cover; }
.ni-txt { min-width: 0; display: grid; gap: 3px; }
.ni-txt p { margin: 0; font-size: 14px; line-height: 1.45; color: #DCD8F3; overflow-wrap: anywhere; }
.ni-txt b, .ni-txt .u, .ni-txt .m { color: var(--paper); font-weight: 800; }
.ni-txt .u { text-decoration: none; }
.ni-txt .m { text-decoration: none; }
.ni-txt .u:hover, .ni-txt .m:hover { text-decoration: underline; }
.ni-txt q { display: block; margin-top: 4px; padding-left: 10px; border-left: 2px solid var(--mist); color: var(--haze); font-size: 13px; quotes: none; }
.ni time { font-size: 12px; color: var(--dim); }
.ni-act { display: flex; align-items: center; }
.ni-ok { font-size: 12.5px; color: var(--dim); font-weight: 700; white-space: nowrap; }
.np-note { margin: 10px 10px 2px; padding: 12px 14px; border-radius: 14px; background: var(--night-3); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--haze); }
.np-empty { padding: 30px 26px 26px; text-align: center; color: var(--haze); display: grid; gap: 8px; justify-items: center; }
.np-empty p { margin: 0; max-width: 34ch; }
.np-empty b { color: var(--paper); }
.np-empty svg { width: 42px; height: 42px; color: var(--mist); margin-bottom: 4px; }
.np-foot { padding: 8px 18px 16px; display: flex; justify-content: center; }
.np-foot a { color: var(--haze); font-size: 13px; }

/* ---------- search: recent searches ---------- */
.res-head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px 6px; font-size: 13px; color: var(--haze); font-weight: 700; }
.res-head button { background: none; border: 0; color: var(--dim); font-size: 12.5px; }
.res-head button:hover { color: var(--paper); }
.res-recent { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 10px 12px; }
.res-recent button { border: 1px solid var(--line); background: var(--night-3); color: var(--paper); border-radius: 999px; padding: 6px 13px; font-size: 13.5px; font-weight: 600; }
.res-recent button:hover { border-color: var(--haze); }

/* ---------- my list: profile header and "continue watching" ---------- */
.me { display: grid; }
.me-banner { position: relative; height: 150px; border-radius: 22px; overflow: hidden; background: linear-gradient(120deg, color-mix(in srgb, var(--tint) 55%, var(--night-2)), var(--night-3)); }
.me-banner img { width: 100%; height: 100%; object-fit: cover; }
.me-banner img.soft { filter: blur(2px) saturate(120%); opacity: .55; transform: scale(1.04); }
.me-banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(20, 17, 48, .75), transparent 65%); }
.me-row { position: relative; z-index: 1; display: flex; align-items: flex-end; gap: 18px; margin: -48px 0 0 22px; }
.me-row .avatar { width: 96px; height: 96px; box-shadow: 0 0 0 4px var(--night), 0 14px 30px -12px rgba(0,0,0,.8); }
.me-row h1 { margin: 0; }
.me-name { margin: 6px 0 4px; color: var(--haze); font-size: 14px; }
.strip.cw-strip { grid-auto-columns: 340px; gap: 16px; }
.cw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr)); gap: 16px; }
.cw { position: relative; display: grid; min-width: 0; border-radius: 18px; overflow: hidden; isolation: isolate; border: 1px solid var(--line); background: color-mix(in srgb, var(--tint) 16%, var(--night-2)); }
.cw-art { position: absolute; inset: 0; z-index: -1; }
.cw-art img { width: 100%; height: 100%; object-fit: cover; opacity: .3; }
.cw-art::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, color-mix(in srgb, var(--tint) 22%, var(--night-2)) 22%, color-mix(in srgb, var(--night-2) 55%, transparent)); }
.cw-hit { display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 16px; align-items: center; width: 100%; padding: 14px 16px 10px 14px; border: 0; background: none; color: inherit; text-align: left; }
.cw-cover { display: block; width: 78px; aspect-ratio: 2 / 3; border-radius: 10px; overflow: hidden; background: var(--mist); box-shadow: 0 12px 26px -12px rgba(0,0,0,.85); }
.cw-cover img { width: 100%; height: 100%; object-fit: cover; }
.cw-txt { display: grid; gap: 4px; min-width: 0; }
.cw-t { font-family: var(--display); font-size: 18px; line-height: 1.2; letter-spacing: -.005em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.cw-hit:hover .cw-t { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px; }
.cw-s { font-size: 13.5px; color: #DCD8F3; font-weight: 500; font-variant-numeric: tabular-nums; }
.cw-next { font-size: 13px; color: var(--haze); }
.cw-next.hot { color: var(--s-watching); font-weight: 800; }
.cw-foot { display: flex; align-items: center; gap: 12px; padding: 0 16px 14px 14px; }
.cw-foot .progbar { flex: 1; background: rgba(20, 17, 48, .65); }
.cw-inc { flex: none; border: 0; border-radius: 10px; background: var(--s-watching); color: var(--night); font-weight: 800; font-size: 13px; padding: 7px 13px; }
.bump .progbar i, .bump .lc-bar i { animation: bump .8s ease-out; }
@keyframes bump { 0% { filter: brightness(1.9); box-shadow: 0 0 14px var(--s-watching); } 100% { filter: none; box-shadow: none; } }

/* ---------- likes on activities ---------- */
.act-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 16px; }
.like { display: inline-flex; align-items: center; gap: 5px; min-height: 28px; background: none; border: 0; padding: 0; color: var(--dim); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.like svg { width: 16px; height: 16px; }
.like:hover, .like[aria-pressed="true"] { color: var(--sakura); }
.like[aria-pressed="true"] svg path { fill: currentColor; }
.like.burst svg { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
.act-meta a { color: var(--dim); font-size: 12.5px; }
.act-meta a:hover { color: var(--paper); }

/* ---------- loading skeletons ---------- */
.sk { display: block; border-radius: 10px; background: linear-gradient(100deg, var(--night-2) 30%, var(--night-3) 50%, var(--night-2) 70%); background-size: 300% 100%; animation: shimmer 1.6s linear infinite; }
.pc-sk { display: grid; gap: 10px; align-content: start; }
.pc-sk .sk:first-child { aspect-ratio: 2 / 3; }
.pc-sk .sk:nth-child(2) { height: 12px; width: 85%; border-radius: 6px; }
.pc-sk .sk:nth-child(3) { height: 10px; width: 50%; border-radius: 6px; }

/* ---------- feedback on touch ---------- */

    for (const list of [state.feed && state.feed.items, ...UFEED.values()]) if (Array.isArray(list)) for (const a of list) {

  async function loadFriend(name, quiet) {
    const key = name.toLowerCase();

  /* ================= rendering: lists ================= */
  function fmtTime(min) {
    const h = Math.floor(min / 60), d = Math.floor(h / 24), rh = h % 24;
    if (d >= 1) return `${plural(d, "jour", "jours")}${rh ? ` et ${plural(rh, "heure", "heures")}` : ""}`;
    if (h >= 1) return plural(h, "heure", "heures");
    return plural(Math.round(min), "minute", "minutes");
  }
  const SORTS = {
    title: (a, b) => titles(a.en, a.ro).main.localeCompare(titles(b.en, b.ro).main, "fr", { sensitivity: "base" }),
    updated: (a, b) => (b.updatedAt || 0) - (a.updatedAt || 0),
    score: (a, b) => (b.score || 0) - (a.score || 0) || (b.updatedAt || 0) - (a.updatedAt || 0),
    year: (a, b) => (b.year || 0) - (a.year || 0),
  };
  function stats(all) {
    const counts = Object.fromEntries(ORDER.map((s) => [s, 0]));
    let eps = 0, mins = 0, sSum = 0, sN = 0;
    for (const e of all) { counts[e.status]++; eps += e.progress || 0; mins += (e.progress || 0) * (e.mins || 24); if (e.score) { sSum += e.score; sN++; } }
    return { counts, eps, mins, avg: sN ? sSum / sN : 0 };

    </div>`;

  function groupsHTML(all, filter, card, opts = {}) {
    return (filter === "all" ? ORDER : [filter]).map((s) => {

      return `<section class="group" style="--sc:var(--s-${s})"><h2><span class="dot" aria-hidden="true"></span>${cw ? "Continuer à regarder" : STATUS[s]} <span class="n num">${items.length}</span></h2><div class="${cw ? "cw-grid" : "grid"}">${items.map(cw ? cwCard : card).join("")}</div></section>`;

  /* A wide card for what you are watching: where you are, what's out, when the next one airs. */
  function fmtWhen(ts) {
    const d = new Date(ts * 1000), i = dayIndex(ts);
    const hour = d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

  }

    const t = titles(e.en, e.ro);
    const total = e.total || 0, p = e.progress || 0;
    const pos = position(e);
    const pct = pos.multi && pos.size ? Math.min(100, Math.round((pos.ep / pos.size) * 100)) : total ? Math.min(100, Math.round((p / total) * 100)) : (p ? 100 : 0);
    const behind = behindOf(e), nx = nextAiring(e);

    else if (nx) next = `Épisode ${nx.ep} ${fmtWhen(nx.at)}`;
    else if (total && p >= total) next = "Tu es à jour";
    const canInc = !total || p < total;
    return `<article class="cw${state.bump === e.id ? " bump" : ""}" style="${tintVars(e.color)}">

  function meHeadHTML(title) {

  /* ================= this week ================= */
  const DAY = 86400;
  function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return Math.floor(d.getTime() / 1000); }

  function myAiringIds() {
    const ids = [];

      if (!["watching", "plan", "paused"].includes(e.status)) continue;
      for (const p of included(e)) if (p.status !== "FINISHED" && p.status !== "CANCELLED") ids.push(p.id);

  }
  let weekLoading = false, weekTried = "";
  async function loadWeek(force) {
    if (weekLoading) return;

    const mode = state.weekMode, from = startOfToday() - 1, to = from + 7 * DAY + 1;
    const ids = mode === "mine" ? myAiringIds() : null;
    const sig = `${mode}:${ids ? ids.join(",") : ""}:${from}`;
    if (!force && state.week && state.week.sig === sig && Date.now() - state.week.at < 10 * 60e3) return;
    if (!force && state.weekErr && weekTried === sig) return;
    weekLoading = true; weekTried = sig; state.weekErr = null;
    try {
      let items = [];
      if (mode === "all" || ids.length) {
        for (let page = 1; page <= 4; page++) {
          const d = await gql(mode === "mine" ? Q_SCHED_MINE : Q_SCHED_ALL, mode === "mine" ? { ids, from, to, page } : { from, to, page });
          items.push(...(d.Page.airingSchedules || []));
          if (!d.Page.pageInfo?.hasNextPage) break;
        }
      }
      items = items.filter((s) => s.media && !s.media.isAdult && s.media.format !== "MUSIC" && (mode === "mine" || (s.media.popularity || 0) >= 2500));
      if (mode === "mine") updateAired(items);
      state.week = { sig, at: Date.now(), items, mode };
    } catch (err) { if (err.kind !== "auth") state.weekErr = err; }
    weekLoading = false;
    if (state.view === "semaine") render();
  }
  /* The schedule tells us how many episodes are out now: keep "à rattraper" accurate. */
  function updateAired(items) {
    const now = Date.now() / 1000, best = new Map();
    for (const s of items) { const n = s.airingAt <= now ? s.episode : s.episode - 1; best.set(s.media.id, Math.max(best.get(s.media.id) || 0, n)); }
    let changed = false;
    for (const e of state.list.values()) for (const p of e.parts || []) {
      const n = best.get(p.id);
      if (n != null && n > (p.aired || 0)) { p.aired = n; changed = true; }

  }
  function behindOf(e) {
    if (e.status !== "watching") return 0;

  }
  function slotHTML(s, now) {
    const it = item(s.media);

    const sub = [`Ép. ${s.episode}${s.media.episodes ? "/" + s.media.episodes : ""}`, it.seq ? (n ? `saison ${n}` : "suite") : null, e ? STATUS[e.status].toLowerCase() : null].filter(Boolean).join(", ");

      <span class="slot-time">${past ? "Sorti à " : ""}${time}</span>

    </li>`;
  }
  function weekHTML() {
    const mine = state.weekMode === "mine";
    const listWait = state.mode === "anilist" && !state.alLoaded;
    const behind = [...state.list.values()].map((e) => [e, behindOf(e)]).filter(([, n]) => n > 0).sort((a, b) => (b[0].updatedAt || 0) - (a[0].updatedAt || 0));
    const now = Date.now() / 1000;
    const ids = mine && !listWait ? myAiringIds() : [];
    let body, sum;
    if ((mine && listWait) || (!state.week && !state.weekErr) || (state.week && state.week.mode !== state.weekMode && !state.weekErr)) {
      body = `<p class="sr">Chargement du programme…</p><div class="week" aria-hidden="true">${Array.from({ length: 7 }, () => `<section class="day"><span class="sk" style="height:16px;width:60%"></span><span class="sk" style="height:60px"></span><span class="sk" style="height:60px"></span></section>`).join("")}</div>`; sum = "Les prochains épisodes, jour par jour.";
    } else if (state.weekErr) {
      body = `<div class="notice"><span>${esc(errText(state.weekErr))}</span><button class="btn btn-sm" data-act="reload-week">Réessayer</button></div>`; sum = "Les prochains épisodes, jour par jour.";
    } else {
      const days = Array.from({ length: 7 }, (_, i) => ({ t: startOfToday() + i * DAY, items: [] }));
      for (const s of state.week.items) { const i = dayIndex(s.airingAt); if (i >= 0 && i < 7) days[i].items.push(s); }
      const count = state.week.items.length;
      sum = mine
        ? (ids.length ? (count ? `${plural(count, "épisode", "épisodes")} de tes animes ${count > 1 ? "sortent" : "sort"} dans les 7 prochains jours.` : "Aucun épisode de tes animes ne sort dans les 7 prochains jours.")
          : "Ajoute à ta liste des animes en cours de diffusion pour voir ici quand sortent leurs épisodes.")
        : `${plural(count, "épisode sort", "épisodes sortent")} cette semaine, toutes séries confondues.`;

  /* ================= compatibilité entre amis ================= */
  function compatOf(groups) {
    const pairs = [], loved = [], both = [];

    for (const f of groups || []) {

      if (m) {
        common++;
        if (m.score && f.score) pairs.push([m, f]);

      } else if (f.score >= 8 && f.status !== "dropped") loved.push(f);
    }
    let pct = null;
    if (pairs.length >= 3) {
      const n = pairs.length;
      // How close your scores are, plus (with enough titles) whether you rank things in the same order.
      const gap = pairs.reduce((s, [m, f]) => s + Math.abs(m.score - f.score), 0) / n;
      let score = Math.max(0, 1 - gap / 4.5);
      if (n >= 5) {

          <div class="prog">${progCtl}<div class="step"><button data-act="dec" aria-label="Un épisode de moins">−</button><button data-act="incd" aria-label="Un épisode de plus">+</button></div></div>
          <div class="progbar"><i style="width:${pct}%"></i></div></div>
        <div class="field"><label class="field-l" for="comment">Mon avis</label><textarea id="comment" maxlength="3000" placeholder="Ce que tu en as pensé, tes persos préférés…">${esc(e.comment || "")}</textarea></div>
      </div>`;
    }
    renderParts();
    const foot = $("#dwFoot");
    if (foot) foot.innerHTML = e ? `<div class="dw-foot"><span>${e.addedAt ? `Dans ta liste depuis le ${new Date(e.addedAt).toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" })}` : "Dans ta liste"}</span><button class="danger${removeArmed ? " armed" : ""}" data-act="remove">${removeArmed ? "Confirmer le retrait" : "Retirer de ma liste"}</button></div>` : "";
    if (keep) { const el = $(keep, $("#drawer")); if (el) el.focus({ preventScroll: true }); }
  }
  function renderParts() {
    const box = $("#parts"); if (!box || !state.sheet) return;
    const fr = state.sheet.fr;
    if (fr.parts.length <= 1) { box.innerHTML = ""; box.hidden = true; return; }
    box.hidden = false;
    const e = state.list.get(String(state.sheet.id));
    const cur = e && e.progress ? included(e)[position(e).season] : null;
    box.innerHTML = `<h3>Les saisons</h3><ul class="parts">${fr.parts.map((p, i) => {
      const t = titles(p.title?.english, p.title?.romaji);
      const off = e && (e.excluded || []).includes(p.id);
      const eps = p.episodes ? plural(p.episodes, "épisode", "épisodes") : p.nextAiringEpisode ? `${p.nextAiringEpisode.episode - 1} épisodes diffusés` : "épisodes à venir";
      const info = [eps, p.seasonYear || p.startDate?.year, AIR[p.status]].filter(Boolean).join(", ");
      return `<li class="part${cur && cur.id === p.id && e.status === "watching" ? " cur" : ""}${off ? " off" : ""}">
        ${img(p.coverImage?.large, "")}
        <div style="min-width:0"><div class="part-t">Saison ${i + 1}</div><div class="part-s">${esc(t.main)}</div><div class="part-s">${esc(info)}</div></div>
        ${e ? `<label><input type="checkbox" data-part="${p.id}" ${off ? "" : "checked"}> Compter</label>` : ""}
      </li>`;
    }).join("")}</ul>`;
  }
  function trapFocus(ev, box = $("#drawer")) {
    const f = [...box.querySelectorAll("button, input, select, textarea, a[href]")].filter((el) => !el.disabled && el.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && (document.activeElement === first || document.activeElement === box)) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }

  /* ================= events ================= */
  document.addEventListener("click", (ev) => {
    const el = ev.target.closest("[data-act]");
    if (!el) return;
    if (el.tagName === "A" && el.getAttribute("href") === "#") ev.preventDefault();
    const act = el.dataset.act;
    const sid = state.sheet ? String(state.sheet.id) : null;
    switch (act) {
      case "open": if (resEl.contains(el)) pushRecent(resState.query); closeResults(); closeSearch(); closeNotifs(); closeThread(); openAnime(el.dataset.id); break;
      case "thread": openThread(el.dataset.id, !!el.dataset.compose); break;
      case "thread-close": closeThread(); break;
      case "thread-more": { const t = $("#thText0"); if (t) t.classList.remove("clamp"); el.remove(); break; }
      case "reply-send": sendReply(); break;
      case "reply-del": deleteReply(Number(el.dataset.rid), el); break;
      case "rlike": toggleReplyLike(Number(el.dataset.rid)); break;
      case "spoil": el.classList.add("on"); el.removeAttribute("role"); el.removeAttribute("tabindex"); break;
      case "bilan-period": state.bilanP = el.dataset.p; render(); break;
      case "bilan-share": shareBilan(el); break;
      case "reopen": openAnime(el.dataset.id); break;
      case "add": ev.stopPropagation(); quickAdd(el.dataset.id, el); break;
      case "close": closeDrawer(); break;
      case "hero": state.heroIdx = Number(el.dataset.i); renderHero(); startHero(); break;
      case "retry": state.homeErr = null; loadHome(true); render(); break;
      case "scroll": { const s = document.getElementById("row-" + el.dataset.row); if (s) s.scrollBy({ left: Number(el.dataset.dir) * s.clientWidth * 0.85, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); break; }
      case "filter": state.filter = el.dataset.f; render(); break;
      case "ffilter": state.ffilter = el.dataset.f; render(); break;
      case "pref": prefs.titles = el.dataset.v; lsSet(K_PREF, prefs); render(); if (state.sheet && state.sheet.fr) renderDrawer(); break;
      case "inc": {
        const e = state.list.get(el.dataset.id);
        if (!e) break;
        state.bump = e.id; clearTimeout(bumpTimer); bumpTimer = setTimeout(() => { state.bump = null; }, 900);
        updateEntry(e.id, { progress: (e.progress || 0) + 1 });
        break;
      }
      case "search-open": openSearch(); break;
      case "search-close": closeSearch(); break;
      case "recent": q.value = el.dataset.q; q.focus({ preventScroll: true }); clearTimeout(searchTimer); runSearch(); break;
      case "recent-clear": lsSet(K_RECENT, []); q.focus({ preventScroll: true }); paintRecents(); break;
      case "notifs": if (notif.open) closeNotifs(); else openNotifs(); break;
      case "notifs-close": closeNotifs(); break;
      case "notifs-retry": notif.err = null; loadNotifs(true); break;
      case "notifs-more": el.disabled = true; loadNotifs(false, true); break;
      case "follow-back": {
        const uid = Number(el.dataset.uid);
        el.disabled = true;
        toggleFollow(uid, el).then((r) => {
          if (r && notif.items) for (const n of notif.items) if (n.user && n.user.id === uid) n.user.isFollowing = !!r.isFollowing;
          paintNotifs();
        });
        break;
      }
      case "notif-seen": markAiringSeen(Number(el.dataset.mid), Number(el.dataset.ep)); break;
      case "airing-on":
        el.disabled = true;
        gql(M_AIRING, {}).then((d) => {
          notif.airing = !!(d && d.UpdateUser && d.UpdateUser.options && d.UpdateUser.options.airingNotifications);
          toast(notif.airing ? "Les alertes de nouveaux épisodes sont activées." : "AniList n'a pas activé les alertes. Réessaie plus tard.");
          paintNotifs();
        }).catch((err) => { toast(errText(err)); el.disabled = false; });
        break;
      case "like": toggleLike(el.dataset.aid); break;
      case "status": {
        const s = el.dataset.s;
        if (!sid || !state.sheet.fr) break;
        if (!state.list.has(sid)) { addEntry(entryFrom(state.sheet.fr, s)); toast(`Ajouté à ta liste dans « ${STATUS[s]} ».`); }
        else updateEntry(sid, { status: s });
        break;
      }
      case "score": { const e = state.list.get(sid); if (e) { const v = Number(el.dataset.v); updateEntry(sid, { score: e.score === v ? 0 : v }); } break; }
      case "dec": { const e = state.list.get(sid); if (e) updateEntry(sid, { progress: (e.progress || 0) - 1 }); break; }
      case "incd": { const e = state.list.get(sid); if (e) updateEntry(sid, { progress: (e.progress || 0) + 1 }); break; }
      case "syn": synOpen = !synOpen; $("#syn")?.classList.toggle("clamp", !synOpen); el.textContent = synOpen ? "Réduire" : "Lire la suite"; break;
      case "remove":
        if (removeArmed) { removeArmed = false; removeEntry(sid); }
        else { removeArmed = true; renderTrack(); setTimeout(() => { if (removeArmed) { removeArmed = false; renderTrack(); } }, 4000); }
        break;
      case "export": exportList(); break;
      case "import": $("#importFile").click(); break;
      case "login": login(); break;
      case "logout": logout(); break;
      case "acct": acctOpen = !acctOpen; $("#acct").innerHTML = acctHTML(); break;
      case "import-local": importLocal(); break;
      case "skip-import": lsSet(K_IMPORT, true); render(); break;
      case "reload-list": if (!auth.viewer) loadAccount(); else { state.alErr = null; loadMyList(); } toast("Mise à jour depuis AniList…"); break;
      case "reload-friends": state.friendsErr = null; loadFriends(true); render(); break;
      case "follow": toggleFollow(el.dataset.uid, el); break;
      case "weekmode": state.weekMode = el.dataset.m; render(); break;
      case "reload-week": state.weekErr = null; loadWeek(true); render(); break;
      case "feed-more": el.disabled = true; loadFeed(true); break;
      case "reload-feed": state.feedErr = null; loadFeed(); render(); break;
      case "feed-refresh": loadFeed(false, false); break;
      case "search-retry": searchCache.delete(q.value.trim().toLowerCase()); runSearch(); q.focus(); break;
      case "reload-recos": state.recos = null; state.recoErr = null; paintRecos(); loadRecos(); break;
      case "install": if (installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; paintInstall(); }); } break;
    }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    const sid = state.sheet ? String(state.sheet.id) : null;
    if (t.id === "sortSel") { state.sort = t.value; render(); return; }
    if (t.id === "showMine") { prefs.showMine = t.checked; lsSet(K_PREF, prefs); state.heroIdx = 0; render(); return; }
    if (t.matches("[data-part]") && sid) {
      const e = state.list.get(sid); if (!e) return;
      const pid = Number(t.dataset.part);
      const ex = new Set(e.excluded || []);
      if (t.checked) ex.delete(pid); else ex.add(pid);
      if (ex.size >= (e.parts || []).length) { t.checked = true; toast("Garde au moins une saison."); return; }
      updateEntry(sid, { excluded: [...ex] });
      return;
    }
    const e = sid && state.list.get(sid);
    if (!e) return;
    if (t.id === "inEp" || t.id === "selSeason") {
      const pos = position(e);
      const inc = included(e);
      const sIdx = $("#selSeason") ? Number($("#selSeason").value) : 0;
      let ep = parseInt($("#inEp")?.value, 10); if (isNaN(ep) || ep < 0) ep = 0;
      if (pos.multi) {
        const before = inc.slice(0, sIdx).reduce((s, p) => s + partSize(p), 0);
        const size = partSize(inc[sIdx]);
        if (t.id === "selSeason") ep = sIdx === pos.season ? pos.ep : 0;
        updateEntry(sid, { progress: before + (size ? Math.min(ep, size) : ep), atSeason: sIdx });
      } else updateEntry(sid, { progress: ep });
    }
  });
  let commentTimer = null;
  function saveComment(sid, val) { const e = state.list.get(sid); if (e && e.comment !== val) { state.list.set(sid, Object.assign({}, e, { comment: val, updatedAt: Date.now() })); persist(sid, 1500); } }
  document.addEventListener("input", (ev) => {
    if (ev.target.id === "fq") { clearTimeout(userTimer); const v = ev.target.value.trim(); state.fq.query = ev.target.value; userTimer = setTimeout(() => searchUsers(v), 450); return; }
    if (ev.target.id !== "comment" || !state.sheet) return;
    const sid = String(state.sheet.id), val = ev.target.value;
    clearTimeout(commentTimer);
    commentTimer = setTimeout(() => saveComment(sid, val), 500);
  });
  document.addEventListener("focusout", (ev) => {
    if (ev.target.id !== "comment" || !state.sheet) return;
    clearTimeout(commentTimer);
    saveComment(String(state.sheet.id), ev.target.value);
  });
  let bumpTimer = null;
  document.addEventListener("input", (ev) => {
    if (ev.target.id !== "thText") return;
    thread.draft = ev.target.value;
    ev.target.style.height = "auto"; ev.target.style.height = Math.min(160, ev.target.scrollHeight + 2) + "px";
    paintComposerState();
  });
  document.addEventListener("keydown", (ev) => {
    const tag = document.activeElement?.tagName || "";
    if (!$("#th").hidden) {
      if (ev.key === "Escape") { ev.preventDefault(); closeThread(); return; }
      if (ev.key === "Tab") { trapFocus(ev, $("#thread")); return; }
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey) && ev.target.id === "thText") { ev.preventDefault(); sendReply(); return; }
      if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("spoil")) { ev.preventDefault(); ev.target.click(); return; }
      return;
    }
    if (ev.key === "/" && !/^(INPUT|TEXTAREA|SELECT)$/.test(tag) && !state.sheet) { ev.preventDefault(); openSearch(); }
    if (ev.key === "Escape" && notif.open) { closeNotifs(); return; }
    if (ev.key === "Escape" && acctOpen) { acctOpen = false; $("#acct").innerHTML = acctHTML(); }
    if (ev.key === "Escape" && state.sheet && document.activeElement !== q) closeDrawer();
    if (ev.key === "Tab" && state.sheet) trapFocus(ev);
  });

  /* ================= export / import ================= */
  function exportList() {
    const data = { app: "animatheque", version: 1, exportedAt: new Date().toISOString(), list: [...state.list.values()].map((e) => { const c = Object.assign({}, e); delete c.al; return c; }) };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `animatheque-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Ta liste a été exportée dans un fichier.");
  }
  $("#importFile").addEventListener("change", async (ev) => {
    const f = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const list = Array.isArray(data) ? data : data.list;
      if (!Array.isArray(list)) throw new Error("format");
      let n = 0;
      for (const e of list) {
        if (!(e && e.id && (e.en || e.ro) && STATUS[e.status])) continue;
        const id = String(e.id);
        const prev = state.list.get(id);
        state.list.set(id, state.mode === "anilist" ? Object.assign({}, e, { id, al: prev ? prev.al : {} }) : Object.assign({}, e, { id }));
        persist(id, 300 + n * 40); n++;
      }
      refresh();
      toast(n ? `${plural(n, "anime importé", "animes importés")}.` : "Aucun anime trouvé dans ce fichier.");
    } catch (_) { toast("Ce fichier n'est pas un export d'Animathèque."); }
  });

  /* ================= routing & boot ================= */
  function route() {
    const h = decodeURIComponent(location.hash || "");
    if (h.startsWith("#ami-")) {
      const name = h.slice(5);
      // Your own profile is not a friend page: send it to your list.
      if (auth.viewer && name.toLowerCase() === String(auth.viewer.name).toLowerCase()) { location.replace("#liste"); return; }
      state.view = "ami";
      loadFriend(name);
      return;
    }
    const nv = { "#liste": "liste", "#decouvrir": "decouvrir", "#semaine": "semaine", "#amis": "amis", "#bilan": "bilan" }[h] || (state.list.size || auth.token ? "liste" : "decouvrir");
    if (nv === "bilan" && state.view !== "bilan") state.bilanAnim = null;
    state.view = nv;
    render();
  }
  window.addEventListener("hashchange", () => {
    // AniList normally reloads the page after login; if only the hash changed, pick the token up here.
    if (/access_token=|error=/.test(location.hash)) {
      const t = lsGet(K_TOKEN, null);
      const p = new URLSearchParams(location.hash.slice(1));
      if (p.get("access_token")) { lsSet(K_TOKEN, { token: p.get("access_token"), exp: Date.now() + (Number(p.get("expires_in")) || 31536000) * 1000 }); }
      try { history.replaceState(null, "", location.pathname + location.search + "#liste"); } catch (_) {}
      const nt = lsGet(K_TOKEN, null);
      if (nt && nt.token && nt.token !== (t && t.token) || (nt && nt.token && !auth.token)) {
        auth.token = nt.token; auth.exp = nt.exp; state.mode = "anilist"; state.list = new Map(); state.alLoaded = false;
        toast("Tu es connecté avec AniList. Ta liste se charge…"); loadAccount();
      }
    }
    const go = () => { closeDrawer(); closeThread(); closeNotifs(); closeSearch(); acctOpen = false; route(); window.scrollTo(0, 0); };
    if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(go); else go();
  });
  route();
  startHero();
  setTimeout(() => loadPopular(false), 8000);
  if (auth.token) loadAccount();
  paintBadge(false);
  setInterval(() => { if (!document.hidden) pollNotifs(); }, 90000);
  setInterval(() => refreshFriends(false), 60000);
  setInterval(() => { if (state.view === "amis" && !feedLoading) paintFeedState(); }, 30000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { pollNotifs(); refreshFriends(false); } });
  if (pendingToast) toast(pendingToast);
})();
</script>
</body>
</html>
